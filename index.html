<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="That's a bingo!">
    <meta name="theme-color" content="#111111">
    <title>That's a bingo!</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #111;
        color: #fff;
      }
      main { display: contents; }
      img {
        display: block;
        width: min(100%, 48rem);
        height: auto;
        max-height: calc(100svh - 2rem);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/thats-a-bingo.gif" width="498" height="199"
        alt="Christoph Waltz as Hans Landa in Inglourious Basterds, saying 'That's a bingo!'">
    </main>
  </body>
</html>
